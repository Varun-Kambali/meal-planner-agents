# Ingredients the recipe writer may use. Each id must be a food in nutrition-mcp (its bundled
# data, plus data/foods once that exists); startup stops on one it does not know. Nothing in this
# file is a nutrition value: those come from nutrition-mcp.
#
# pack_g, keeps_days_opened and measures are planning facts, typical values for the no-waste check
# and for turning a household unit into grams, reviewed by hand. A wrong one changes a warning or
# the grams a typed "2 eggs" counts for. It never changes a nutrient value per 100 g.
#
# pack_g: a usual Indian retail pack in grams. A liquid sold by volume is that volume times the
#   density nutrition-mcp holds for it.
# keeps_days_opened: how long it keeps once opened or cut.
# Both are null for what a recipe uses by the pinch, so the no-waste check leaves it out.
# allergens: the groups in the plan rules. Coconut is not listed under tree_nuts, in line with the
#   EU allergen list, which names the nuts one by one and leaves coconut out.
# measures: grams in one household unit, only where nutrition-mcp has no such unit for the food
#   (loading stops if it has one). The comment above each says where the weight comes from. Weights
#   are for the edible part, like nutrition-mcp's per-100 g values.
# category: the shop aisle.
#
# baking_soda is in nutrition-mcp's bundled data and left out of this list on purpose.

# Grains, flours and bread. Rice and flours come in 500 g to 1 kg packs. A flour goes stale in
# a few months in an Indian kitchen, so its shelf life is shorter than a grain's.
- {id: white_rice, name: White rice, category: grain, allergens: [], pack_g: 1000, keeps_days_opened: 365}
- {id: rava, name: Rava (semolina), category: grain, allergens: [gluten], pack_g: 500, keeps_days_opened: 180}
- {id: atta, name: Atta (whole-wheat flour), category: grain, allergens: [gluten], pack_g: 1000, keeps_days_opened: 90}
- {id: maida, name: Maida (refined wheat flour), category: grain, allergens: [gluten], pack_g: 500, keeps_days_opened: 180}
- {id: besan, name: Besan (chickpea flour), category: grain, allergens: [], pack_g: 500, keeps_days_opened: 180}
- {id: sabudana, name: Sabudana (tapioca pearls), category: grain, allergens: [], pack_g: 500, keeps_days_opened: 365}
# A pack of six rolls.
- {id: pav, name: Pav (bread roll), category: grain, allergens: [gluten], pack_g: 200, keeps_days_opened: 2}

