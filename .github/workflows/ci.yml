name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_FROZEN: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # With UV_FROZEN set, `uv lock --check` only checks that the lockfile parses, not that
      # it matches pyproject.toml.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
        env:
          UV_FROZEN: "0"
      - run: uv sync --all-groups
      - run: make lint
      - run: make test
      - name: Check the committed JSON Schema matches the models
        run: |
          uv run python scripts/export_schemas.py
          # Porcelain status also lists new, untracked schema files, which git diff misses.
          changes="$(git status --porcelain schemas/)"
          if [ -n "$changes" ]; then echo "$changes"; git diff schemas/; exit 1; fi
  # Builds the image once, starts it as a host would, and calls it over HTTP. The model key is a
  # placeholder: the startup check only looks that the variable is set, and /healthz and
  # /v1/catalogue never call a model, so no key and no model call are involved. Memory is printed
  # so the Linux figure can be set against a 512 MB free instance.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: docker build -t meal-planner-agents .
      - name: Start the container
        run: |
          docker run -d --name api -p 8000:8000 -e GEMINI_API_KEY=placeholder-no-model-call meal-planner-agents
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; exit 0; fi
            # A container that has exited will not start answering.
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != true ]; then
              echo "the container is not running" >&2
              docker logs api
              exit 1
            fi
            sleep 2
          done
          docker logs api
          exit 1
      # The first probe runs after the 30 s interval and each one may take 5 s, so allow 90 s.
      - name: Container reports healthy
        run: |
          for i in $(seq 1 45); do
            status="$(docker inspect -f '{{.State.Health.Status}}' api)"
            echo "health: $status"
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Memory once up
        run: |
          docker stats --no-stream --format 'once up: {{.MemUsage}} ({{.MemPerc}})' api
      - name: Call the catalogue
        run: |
          curl -fsS -o catalogue.json http://127.0.0.1:8000/v1/catalogue
          head -c 300 catalogue.json
          echo
      - name: Memory after the catalogue call
        run: |
          docker stats --no-stream --format 'after the catalogue call: {{.MemUsage}} ({{.MemPerc}})' api
      - name: Test the running image
        run: uv run pytest tests/integration/test_container.py --no-cov
        env:
          MEAL_PLANNER_IMAGE: meal-planner-agents
      - name: Container runs without root
        run: test "$(docker exec api id -u)" = 1000
      - name: Container log
        if: always()
        run: docker logs api
  # Replays the recorded smoke slice and holds it to evals/thresholds.toml. It makes no model
  # call, so it needs no key; nutrition-mcp runs here as it does for a user.
  eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: make eval-smoke
  # The browser app. Its types are generated from schemas/, which the check job holds to the
  # models, so a model change that is not carried through to src/types.ts fails here.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          # pa11y-ci's puppeteer would download a Chrome; the a11y job uses the runner's own.
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Check src/types.ts matches schemas/
        run: npm run types:check
      - name: Check src/generated/validators.js matches schemas/
        run: npm run validators:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Vitest with coverage: the core logic files each need 80% (vite.config.ts).
      - run: npm run test:coverage
      - run: npm run build
      # The Pages workflow builds with a base path. A page address, a script, a stylesheet, the
      # favicon or a font that still starts at the root would 404 there.
      - name: Check a build under a base path keeps every address under it
        env:
          VITE_BASE_PATH: /meal-planner-agents/
        run: |
          out="$RUNNER_TEMP/pages-check"
          npx vite build --outDir "$out" --emptyOutDir
          grep -q 'src="/meal-planner-agents/assets/' "$out/index.html"
          grep -q 'href="/meal-planner-agents/favicon.svg"' "$out/index.html"
          if grep -hE '(src|href)="/' "$out/index.html" | grep -v '="/meal-planner-agents/'; then
            echo "index.html has an address outside /meal-planner-agents/" >&2
            exit 1
          fi
          if grep -hoE "url\(['\"]?/[^)]*\)" "$out"/assets/*.css | grep -vE "url\(['\"]?/meal-planner-agents/"; then
            echo "a stylesheet has an address outside /meal-planner-agents/" >&2
            exit 1
          fi
  # pa11y-ci with axe over the built site: every screen in frontend/pa11y.json, at desktop and
  # phone width, in the light theme and then the dark one (scripts/a11y.ts). The week and recipe
  # screens open on a recorded week, and the API is a stand-in, so no model is called.
  a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run build
      - run: npm run a11y
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
