[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meal-planner-agents"
dynamic = ["version"]
description = "Writes recipes for the meal plan you already follow, checked in code with nutrition-mcp, and tracks meals against it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Varun Kambali" }]
requires-python = ">=3.12"
dependencies = [
    # Exact: LangGraph's streaming and runtime APIs change between minor releases.
    "langgraph==1.2.16",
    # Exact: LiteLLM ships several releases a week, so a bump is a deliberate change.
    "litellm==1.105.1",
    "mcp>=2.3,<3",
    "nutrition-mcp",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6",
]

[project.scripts]
meal-planner = "meal_planner.cli:main"

[project.urls]
Repository = "https://github.com/Varun-Kambali/meal-planner-agents"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "anyio",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pre-commit",
]
build-data = ["httpx"]

[tool.hatch.version]
path = "src/meal_planner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/meal_planner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

# nutrition-mcp ships no py.typed marker, so mypy reads its source instead of treating it as Any.
[[tool.mypy.overrides]]
module = "nutrition_mcp.*"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The eval and build scripts are not part of the package; tests import them from here. Many tests
# import tests/fakes.py, and importlib mode does not put tests/ on the path by itself.
pythonpath = ["evals", "scripts", "tests"]
addopts = "-ra --import-mode=importlib"
filterwarnings = [
    # Pydantic building a schema for one of LiteLLM's own types. Nothing here to change.
    "ignore:Item 'summary' on TypedDict class 'ChatCompletionReasoningItem':UserWarning",
]

[tool.uv.sources]
nutrition-mcp = { git = "https://github.com/Varun-Kambali/nutrition-mcp", rev = "v1.0.0" }
